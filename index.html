<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png">
  <link rel="stylesheet" href="styles/styles.css" />
  <title>Base Apparel coming soon page</title>
</head>

<body>
  <main>
    <section>
      <article>
        <header>
          <img src="img/logo.svg" alt="Base Apparel">
        </header>

        <h1>
          <span>We're</span><br>
          <strong>Coming<br> Soon</strong>
        </h1>

        <p>
          Hello fellow shoppers! We're currently building our new fashion store.
          Add your email below to stay up-to-date with announcements and our launch deals.
        </p>

        <form id="newsletter" novalidate>
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="Email Address" required>
          <span class="field-icon" aria-hidden="true"></span>
          <button type="submit" aria-label="Submit email">
                <img src="./img/icon-arrow.svg" alt="" width="18" height="18">
          </button>
        </form>
          <p class="error" aria-live="polite"></p>
      </article>

      <figure>
        <picture>
          <source media="(max-width: 760px)" srcset="img/hero-mobile.jpg" />
        <img src="img/hero-desktop.jpg" alt="head of a girl" />
      </picture>
      </figure>
    </section>
  </main>

  <script>const form = document.getElementById("newsletter");
    const emailInput = document.getElementById("email");
    const errorMsg = document.querySelector(".error");
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();

    if (!emailPattern.test(email)) {
      errorMsg.textContent = "⚠️ Merci d'entrer une adresse email valide.";
      errorMsg.classList.remove('success');
      errorMsg.classList.add('error-msg');
      emailInput.classList.remove('is-valid');
      emailInput.classList.add('is-error');
      emailInput.setAttribute('aria-invalid', 'true');
    } else {
      errorMsg.textContent = "✅ Merci ! Votre email est enregistré.";
      errorMsg.classList.remove('error-msg');
      errorMsg.classList.add('success');
      emailInput.classList.remove('is-error');
      emailInput.classList.add('is-valid');
      emailInput.setAttribute('aria-invalid', 'false');
    }
    });</script>
</body>

</html>
